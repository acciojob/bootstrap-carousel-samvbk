<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="https://jsdelivr.net" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <div id="myCarousel" class="carousel slide" data-ride="carousel slide">
		<div class="carousel-inner">
			<div class="carousel-item">
				<img class="first-slide d-block w-100" src="..." alt="First slide">
			</div>
			<div class="carousel-item">
				<img class="second-slide d-block w-100" src="..." alt="First slide">
			</div>
			<div class="carousel-item active">
				<img class="third-slide d-block w-100" src="..." alt="First slide">
			</div>
			<div class="carousel-item">
				<img class="fourth-slide d-block w-100" src="..." alt="First slide">
			</div>
			<div class="carousel-item">
				<img class="fifth-slide d-block w-100" src="..." alt="First slide">
			</div>
			<a class="glyphicon-chevron-left carousel-control left" href="#myCarousel" role="button" data-slide="prev">
				<span class="carousel-control-prev-icon left" aria-hidden="true"></span>
				<span class="sr-only">Previous</span>
			</a>
			<a class="glyphicon-chevron-right carousel-control right" href="#myCarousel" role="button" data-slide="next">
				<span class="carousel-control-next-icon right" aria-hidden="true"></span>
				<span class="sr-only">next</span>
			</a>
			
		</div>
	</div>


























	
    <!-- Bootstrap Bundle with Popper -->
	<!-- jQuery first, then Popper.js, then Bootstrap JS -->
	<script src="https://jquery.com" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
	<script src="https://jsdelivr.net" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
	<script src="https://jsdelivr.net" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>



	
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
	<!-- <script>
        $(document).ready(function () {
            $('#myCarousel').carousel({
                interval: 3000
            });
        });
    </script> -->
	<script>
		$(document).ready(function(){
			$('.carousel').carousel({
				interval: 2000
			})
			$('#myCarousel').carousel(2);
			$('.left').click(function() {
			    $carousel.carousel('prev');
		    });
			$('.right').click(function() {
			    $carousel.carousel('next');
		    });
		});
	</script>
</body>
 
</html>
