<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body>
    <div id="myCarousel" class="carousel slide" data-ride="carousel slide">
		<div class="carousel-inner">
			<div class="carousel-item">
				<img class="first-slide d-block w-100" src="..." alt="First slide">
			</div>
			<div class="carousel-item">
				<img class="second-slide d-block w-100" src="..." alt="First slide">
			</div>
			<div class="carousel-item active">
				<img class="third-slide d-block w-100" src="..." alt="First slide">
			</div>
			<div class="carousel-item">
				<img class="fourth-slide d-block w-100" src="..." alt="First slide">
			</div>
			<div class="carousel-item">
				<img class="fifth-slide d-block w-100" src="..." alt="First slide">
			</div>
			<a class="glyphicon-chevron-left carousel-control left" href="#myCarousel" role="button" data-slide="prev">
				<span class="carousel-control-prev-icon left" aria-hidden="true"></span>
				<span class="sr-only">Previous</span>
			</a>
			<a class="glyphicon-chevron-right carousel-control right" href="#myCarousel" role="button" data-slide="next">
				<span class="carousel-control-next-icon right" aria-hidden="true"></span>
				<span class="sr-only">next</span>
			</a>
			
		</div>
	</div>


























	
    <!-- Bootstrap Bundle with Popper -->
	<!-- jQuery first, then Popper.js, then Bootstrap JS -->


	
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
	<!-- <script>
        $(document).ready(function () {
            $('#myCarousel').carousel({
                interval: 3000
            });
        });
    </script> -->
	<script>
		$(document).ready(function(){
			$('.carousel').carousel({
				interval: 2000
			})
			$('#myCarousel').carousel(2);
			$('.left').click(function() {
			    $carousel.carousel('prev');
		    });
			$('.right').click(function() {
			    $carousel.carousel('next');
		    });
		});
	</script>
</body>
 
</html>
