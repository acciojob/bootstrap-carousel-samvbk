<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
    <div id="myCarousel" class="carousel slide" data-ride="carousel">
		<div class="carousel-inner">
			<div class="carousel-item">
				<img class="first-slide d-block w-100" src="..." alt="First slide">
			</div>
			<div class="carousel-item">
				<img class="second-slide d-block w-100" src="..." alt="First slide">
			</div>
			<div class="carousel-item active">
				<img class="third-slide d-block w-100" src="..." alt="First slide">
			</div>
			<div class="carousel-item">
				<img class="fourth-slide d-block w-100" src="..." alt="First slide">
			</div>
			<div class="carousel-item">
				<img class="fifth-slide d-block w-100" src="..." alt="First slide">
			</div>
			<a class="glyphicon-chevron-left carousel-control-prev left" href="#myCarousel" role="button" data-slide="prev">
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="sr-only">Previous</span>
			</a>
			<a class="glyphicon-chevron-right carousel-control-next right" href="#myCarousel" role="button" data-slide="prev">
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="sr-only">next</span>
			</a>
			
		</div>
	</div>


























	
    <!-- Bootstrap Bundle with Popper -->
	


	
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
	<!-- <script>
        $(document).ready(function () {
            $('#myCarousel').carousel({
                interval: 3000
            });
        });
    </script> -->
	<script>
		$(document).ready(function(){
			$('.carousel').carousel({
				interval: 2000
			})
			$('#myCarousel').carousel(2);
		});
	</script>
</body>
 
</html>
